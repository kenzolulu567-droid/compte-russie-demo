<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compte Russie — Démonstration</title>
<style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#18202a}header{text-align:center;background:#fff;padding:20px;border-bottom:1px solid #ddd}.logo{width:70px;height:45px}.note{color:#666;font-size:14px}main{max-width:760px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #ccd2d8}button{background:#222;color:#fff;border:0;cursor:pointer}.full{grid-column:1/-1}.result{margin-top:14px;padding:12px;background:#f1f3f5;border-radius:9px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><img class="logo" src="https://upload.wikimedia.org/wikipedia/en/f/f3/Flag_of_Russia.svg" alt="Drapeau de la Russie"><h1>COMPTE RUSSIE</h1></header>
<main><section class="card"><h2>Créer une demande</h2><form id="signup"><div class="grid"><input name="first" placeholder="Prénom" required><input name="last" placeholder="Nom" required><input name="email" type="email" placeholder="E-mail" required><input name="username" placeholder="Nom d'utilisateur" required><input name="country" placeholder="Pays" required><input name="city" placeholder="Ville" required><button class="full">Envoyer la demande</button></div></form><div id="signupResult" class="result" hidden></div></section>
<section class="card"><h2>Suivre une demande</h2><form id="statusForm" class="grid"><input name="username" class="full" placeholder="Nom d'utilisateur" required><button class="full">Vérifier le statut</button></form><div id="statusResult" class="result" hidden></div></section>
<section class="card"><h2>Service client</h2><div id="contact">Chargement…</div></section></main>
<script>const $=s=>document.querySelector(s);signup.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),r=await fetch("/api/requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}),j=await r.json();signupResult.hidden=false;signupResult.textContent=r.ok?"Demande envoyée avec succès. Conservez votre nom d'utilisateur.":j.error||"Erreur";if(r.ok)e.target.reset()};statusForm.onsubmit=async e=>{e.preventDefault();let u=new FormData(e.target).get("username"),r=await fetch("/api/status/"+encodeURIComponent(u)),j=await r.json();statusResult.hidden=false;statusResult.textContent=r.ok?"Statut : "+j.status:j.error};fetch("/api/settings").then(r=>r.json()).then(s=>{let a=[];if(s.whatsapp)a.push(`<a href="https://wa.me/${s.whatsapp.replace(/\\D/g,"")}">WhatsApp : ${s.whatsapp}</a>`);if(s.email)a.push(`<a href="mailto:${s.email}">E-mail : ${s.email}</a>`);if(s.hours)a.push("Horaires : "+s.hours);contact.innerHTML=a.join("<br>")||"Contact à configurer."});</script></body></html>
